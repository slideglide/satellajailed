name: Patch IPA from URL with SatellaJailed

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct download URL to the IPA file"
        required: true
        type: string

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SatellaJailed
        uses: actions/checkout@v4
        with:
          repository: Paisseon/SatellaJailed
          path: SatellaJailed

      - name: Download IPA from URL
        run: |
          cd SatellaJailed
          echo "Downloading IPA from ${{ inputs.ipa_url }}"
          curl -L -O "${{ inputs.ipa_url }}" || wget "${{ inputs.ipa_url }}"
          echo "Download complete."
          ls -lh *.ipa || true

      - name: Make patch script executable
        run: chmod +x SatellaJailed/patch-linux.sh

      - name: Run patch script
        run: |
          cd SatellaJailed
          sh patch-linux.sh

      - name: Upload patched IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-ipa
          path: SatellaJailed/*.ipa