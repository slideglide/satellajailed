name: Patch IPA from URL with SatellaJailed

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct download URL to the IPA file"
        required: true
        type: string

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SatellaJailed
        uses: actions/checkout@v4
        with:
          repository: Paisseon/SatellaJailed
          path: SatellaJailed

      - name: Install dependencies (Azule + system tools)
        run: |
          sudo apt update
          sudo apt install -y \
            jq unzip zip python3 git curl wget \
            libplist-utils xmlstarlet libxml2-utils

      - name: Install Azule properly (git repo)
        run: |
          git clone https://github.com/Al4ise/Azule.git
          echo "$PWD/Azule" >> $GITHUB_PATH
          export PATH="$PWD/Azule:$PATH"
          azule --help || true

      - name: Download IPA from URL
        run: |
          cd SatellaJailed
          echo "Downloading IPA from ${{ inputs.ipa_url }}"
          curl -L -O "${{ inputs.ipa_url }}" || wget "${{ inputs.ipa_url }}"
          echo "Download complete:"
          ls -lh *.ipa || true

      - name: Run SatellaJailed patch
        run: |
          cd SatellaJailed
          chmod +x patch-linux.sh
          export PATH="${{ github.workspace }}/Azule:$PATH"
          echo "Running SatellaJailed patch..."
          sh patch-linux.sh | tee patch.log
          echo "Patch completed."

      - name: Show patch log
        run: |
          echo "===== Patch Log Output ====="
          cat SatellaJailed/patch.log || true

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: patched-ipa
          path: SatellaJailed/*_Patched.ipa